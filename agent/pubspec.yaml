name: agent
description: Listen the payment notification on Android.

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.6.1

  # Database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3

  # UI
  velocity_x: ^4.1.1
  fl_chart: ^0.66.0

  # QR
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Utils
  shared_preferences: ^2.2.2
  synchronized: ^3.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.8.1
  http: ^1.1.2

  # Background work
  workmanager: ^0.6.0

  # Notification listener
  flutter_notification_listener: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.8
  drift_dev: ^2.21.0
  riverpod_generator: ^2.3.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1

  # Splash & Icons
  flutter_native_splash: ^2.3.9
  flutter_launcher_icons: ^0.13.1

  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
